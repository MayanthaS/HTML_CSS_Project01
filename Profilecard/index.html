<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="profile-box">
            <img src="./img/images/menu.png" class="menu" alt="Menu" title="Menu">
            <img src="./img/images/setting.png" class="setting" alt="Settings" title="Settings">
            <img src="./img/images/profile-pic.png" class="profile">
            <h3>Jacksons</h3>
            <p>Web Developer</p>

            <div class="social-media">
                <img src="./img/images/instagram.png" alt="">
                <img src="./img/images/telegram.png" alt="">
                <img src="./img/images/dribble.png" alt="">
            </div>
            <button class="btn"   type="button">Follow</button>
            <div class="profile-bottom">
                <p>Learn More about My profile</p>
                <img src="./img/images/arrow.png" class="arrow">
            </div>
        </div>
    </div>
</body>
</html>
